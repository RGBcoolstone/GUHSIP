<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Profile | GUHSIP</title><link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head>
<body>
<main>
  <div id="head" class="card"></div>
  <form id="ef" class="card" hidden>
    <h2>Edit profile</h2>
    <div class="row" style="justify-content:flex-start;margin-bottom:10px"><label class="filebtn">+ Change photo<input id="pic" type="file" hidden accept="image/jpeg,image/png,image/webp"></label><span id="pn" class="muted"></span></div>
    <textarea id="bio" maxlength="200" placeholder="Bio (200 characters max)"></textarea>
    <input id="l1" placeholder="Link 1 (https://...)"><input id="l2" placeholder="Link 2 (https://...)"><input id="l3" placeholder="Link 3 (https://...)">
    <div class="row"><button type="button" id="cx" class="ghost">Cancel</button><button class="btn">Save</button></div>
    <p id="em" class="msg"></p>
    <h2 style="margin-top:14px">Recovery code</h2><p class="muted">Lets you reset your password without email. A new code replaces the old one.</p>
    <button type="button" id="rcb" class="ghost">Make a new recovery code</button><div id="rcd" class="code" hidden></div>
    <h2 style="margin-top:14px">Delete account</h2><p class="muted">Permanently removes your account, sips, comments and messages. This cannot be undone.</p>
    <button type="button" id="dab" class="ghost" style="color:#ff6b6b;border-color:#ff6b6b">Delete my account</button>
  </form>
  <h2>Sips</h2>
  <div id="feed"></div>
</main>
<script src="config.js"></script><script src="common.js"></script>
<script>
let pid = null, prof = null, n = 0, gc = 0, fc = 0;
window.afterBlock = () => { show(); refresh(); };
window.afterFollow = (id, on) => { if (id === pid) { gc += on ? 1 : -1; show(); } };
const refresh = () => load($('feed'), q => q.eq('author_id', pid), 'No sips yet.');
const safe = u => /^https?:\/\/\S+$/i.test(u);

function show() {
  const links = (prof.links || []).filter(safe).map(l => `<a class="pill" href="${esc(l)}" target="_blank" rel="noopener noreferrer nofollow">${esc(l.replace(/^https?:\/\/(www\.)?/i, '').slice(0, 30))}</a>`).join('');
  $('head').innerHTML = `<div class="who">${avatar(prof.avatar_url, prof.username, 'av big')}
    <div style="flex:1"><h2 style="margin:0">@${esc(prof.username)}${prof.verified ? VB : ''}</h2><div class="meta">${n} sip${n === 1 ? '' : 's'}, ${gc} Guhsipper${gc === 1 ? '' : 's'}, ${fc} following, joined ${new Date(prof.created_at).toLocaleDateString()}</div></div>
    ${pid === me ? '<button id="eb" class="ghost">Edit profile</button>' : followBtn(pid) + `<a class="pill" style="margin-left:8px" href="messages.html?u=${esc(prof.username)}">Message</a><a class="pill" style="margin-left:8px" href="report.html?u=${esc(prof.username)}">Report</a><button class="pill" style="margin-left:8px" data-blk="${pid}">${BLOCKED.has(pid) ? 'Unblock' : 'Block'}</button>`}</div>
    ${prof.bio ? `<p>${esc(prof.bio)}</p>` : pid === me ? '<p class="muted">Add a bio so people know your vibe.</p>' : ''}
    <div class="acts">${links}</div>`;
  if ($('eb')) $('eb').onclick = () => {
    $('bio').value = prof.bio || '';
    [0, 1, 2].forEach(i => $('l' + (i + 1)).value = (prof.links || [])[i] || '');
    $('em').textContent = ''; $('ef').hidden = false;
  };
}

guard().then(async id => {
  if (!id) return;
  const u = new URLSearchParams(location.search).get('u');
  const cols = 'id,username,created_at,avatar_url,bio,links,verified';
  const { data } = await (u ? sb.from('profiles').select(cols).eq('username', u.toLowerCase()) : sb.from('profiles').select(cols).eq('id', me)).maybeSingle();
  if (!data) return $('head').innerHTML = '<p class="muted">No account with that username.</p>';
  prof = data; pid = data.id;
  n = (await sb.from('posts').select('id', { count: 'exact', head: true }).eq('author_id', pid)).count || 0;
  const cnt = async col => (await sb.from('follows').select('follower_id', { count: 'exact', head: true }).eq(col, pid)).count || 0;
  gc = await cnt('following_id'); fc = await cnt('follower_id'); await loadFollowing(); await loadBlocked();
  show(); refresh();
});

$('dab').onclick = async () => {
  if (prompt('This permanently deletes your account, sips, comments and messages. Type DELETE to confirm.') !== 'DELETE') return;
  const r = await sb.rpc('delete_my_account');
  if (r.error) return alert(friendly(r.error, "Couldn't delete your account. Please try again."));
  await sb.auth.signOut(); alert('Your account has been deleted.'); location.href = 'index.html';
};
$('rcb').onclick = async () => {
  if (!confirm('This replaces your old recovery code. Continue?')) return;
  const c = await newCode();
  if (!c) return alert(friendly(null, "Couldn't make a code. Please try again."));
  $('rcd').hidden = false; $('rcd').textContent = fmtCode(c);
  alert('Save this code now. It is shown once.');
};
$('pic').onchange = () => $('pn').textContent = $('pic').files[0]?.name || '';
$('cx').onclick = () => $('ef').hidden = true;
$('ef').onsubmit = async e => {
  e.preventDefault(); $('em').textContent = '';
  const links = [1, 2, 3].map(i => $('l' + i).value.trim()).filter(Boolean);
  if (links.some(l => !safe(l))) return $('em').textContent = 'Links must start with http:// or https://';
  const upd = { bio: $('bio').value.trim() || null, links }, f = $('pic').files[0];
  if (f) {
    if (f.size > 10 * 1024 * 1024) return $('em').textContent = 'Photo must be under 10 MB.';
    const path = `${me}/avatar-${Date.now()}.jpg`;
    const up = await sb.storage.from('post-images').upload(path, await squash(f, 512), { contentType: 'image/jpeg' });
    if (up.error) return $('em').textContent = 'Photo upload failed. Try a smaller image.';
    upd.avatar_url = sb.storage.from('post-images').getPublicUrl(path).data.publicUrl;
  }
  const r = await sb.from('profiles').update(upd).eq('id', me);
  if (r.error) return $('em').textContent = friendly(r.error, "Couldn't save your profile. Please try again.");
  Object.assign(prof, upd); $('ef').hidden = true; $('pic').value = ''; $('pn').textContent = ''; show();
};
</script></body></html>
